name: check

# Runs tools/check.py (parser, server routes, both probe batteries, screenshots)
# on every pull request and every push to main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools (the app itself is stdlib only)
        run: |
          pip install playwright==1.63.0 pillow
          python -m playwright install --with-deps chromium
          # fidelity reference renderer + fonts with Office-compatible widths
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-impress poppler-utils fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation
      - name: Run every check
        run: python tools/check.py
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            state/check/
            state/fidelity/
          if-no-files-found: ignore
